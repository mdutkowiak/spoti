# ==============================================================================
# REVERSE PROXY NGINX CONFIGURATION DLA DOMENY: spoti.daqu.eu
# ==============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ------------------------------------------------------------------------------
# PRZEKIEROWANIE HTTP -> HTTPS
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name spoti.daqu.eu *.spoti.daqu.eu;

    # Obsługa wyzwania Let's Encrypt / Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# GŁÓWNY HUB: spoti.daqu.eu (Navidrome + OpenSubsonic API + Dashboard)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name spoti.daqu.eu;

    # Certyfikaty SSL Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/spoti.daqu.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spoti.daqu.eu/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 128M;

    # Podstawowe nagłówki proxy
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # WebSockets
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # 1. API pobierania i Web Dashboard (Download-on-Demand): https://spoti.daqu.eu/dl/
    location /dl/ {
        proxy_pass http://music-downloader-api:8000/;
        proxy_redirect off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 2. Bezpośrednie endpointy API pobierania dla skryptów i integracji
    location ~* ^/(search|download|download-selected|inspect|tasks|refresh-navidrome|library|health|docs|openapi.json) {
        proxy_pass http://music-downloader-api:8000;
        proxy_redirect off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 3. Specjalna optymalizacja dla strumieniowania audio OpenSubsonic
    # (Wyłączenie buforowania Nginx zapobiega opóźnieniom i zrywaniu odtwarzania w CarPlay/telefonie)
    location ~* ^/(rest|api)/stream {
        proxy_pass http://navidrome:4533;
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
        send_timeout 1200s;
    }

    # 4. Główny serwer Navidrome (Subsonic API dla Symfonium, Amperfy, Feishin Desktop)
    location / {
        proxy_pass http://navidrome:4533;
        proxy_redirect off;
    }
}

# ------------------------------------------------------------------------------
# OPCJONALNA SUBDOMENA: app.spoti.daqu.eu (Feishin Web - Klon Spotify 1:1)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.spoti.daqu.eu;

    ssl_certificate /etc/letsencrypt/live/spoti.daqu.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spoti.daqu.eu/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location / {
        proxy_pass http://feishin:9180;
        proxy_redirect off;
    }
}
